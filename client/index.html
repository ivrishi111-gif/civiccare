<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CIVICCARE — See it. Report it. Track it. Report public problems in your area with AI help." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <title>CIVICCARE — See it. Report it. Track it.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Safety net: if the app ever fails to start, show a clear message
      // instead of a white screen (helps users and debugging).
      (function () {
        function showFatal(msg) {
          var el = document.getElementById('fatal-error');
          if (!el) {
            el = document.createElement('div');
            el.id = 'fatal-error';
            el.style.cssText =
              'position:fixed;inset:0;z-index:99999;background:#fff;color:#b91c1c;font-family:system-ui,sans-serif;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px';
            document.body.appendChild(el);
          }
          el.innerHTML =
            '<div style="font-size:40px">⚠️</div>' +
            '<div style="font-weight:800;font-size:18px;color:#0f172a">The app could not start</div>' +
            '<div style="font-size:14px;color:#374151;max-width:520px;word-break:break-word">' +
            String(msg).replace(/</g, '&lt;') +
            '</div>' +
            '<button onclick="location.reload()" style="font-weight:800;padding:10px 22px;border-radius:12px;background:#0284c7;color:#fff;border:0">Reload</button>';
        }
        window.addEventListener('error', function (e) {
          if (e && e.message) showFatal(e.message + (e.filename ? ' (in ' + e.filename + ')' : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          showFatal((r && (r.message || r.reason)) || String(r));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            showFatal(
              'The page loaded but the app did not start on this device. Please reload, try a different browser, or send this screen to support.'
            );
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
